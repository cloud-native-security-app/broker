[package]
name = "broker-verification"
version = "0.1.0"
edition = "2021"
publish = false
description = "Crate de verificación de la topología y el contrato de mensajes del Broker (testcontainers + lapin). No es una librería compartida ni produce un binario de producción."

[dependencies]
lapin = "4.11.0"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15.0", features = ["rabbitmq"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
