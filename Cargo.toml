[package]
name = "broker-verification"
version = "0.1.0"
edition = "2021"
publish = false
description = "Crate de verificación de la topología y el contrato de mensajes del Broker (testcontainers + LocalStack). No es una librería compartida ni produce un binario de producción."

[dependencies]
jsonschema = { version = "0.56", default-features = false }
serde_json = "1.0.151"
thiserror = "2.0"

[dev-dependencies]
aws-sdk-sns = "1.116.0"
aws-sdk-sqs = "1.114.0"
testcontainers = "0.27"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
