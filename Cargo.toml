[package]
name = "broker-verification"
version = "0.1.0"
edition = "2021"
publish = false
description = "Crate de verificación de la topología y el contrato de mensajes del Broker (testcontainers + lapin). No es una librería compartida ni produce un binario de producción."

[dependencies]
jsonschema = { version = "0.56", default-features = false }
lapin = "4.11.0"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15.0", features = ["rabbitmq"] }
thiserror = "2.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }

[dev-dependencies]
# Solo para instalar explícitamente el CryptoProvider de rustls antes de
# abrir una conexión AMQPS en los tests (ver tests/common/mod.rs,
# `ensure_rustls_crypto_provider`) — este crate ya trae `rustls` de forma
# transitiva (vía `lapin`, `reqwest`/`rustls-platform-verifier` y
# `testcontainers`/`bollard`/`hyper-rustls`), pero dos proveedores
# criptográficos distintos (`ring` y `aws-lc-rs`) quedan compilados a la
# vez, y rustls no puede auto-seleccionar uno — hay que instalarlo a mano
# una sola vez por proceso.
rustls = "0.23"
